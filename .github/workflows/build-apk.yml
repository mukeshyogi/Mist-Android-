name: Build Mist Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { java-version: 17, distribution: temurin }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run build:web
      - run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          # re-apply MistMedia plugin files after cap add (they live in android/app/src/main/java)
          cp -r android-plugin-src/* android/app/src/main/java/ 2>/dev/null || true
          # ensure plugin is registered - see android/app/src/main/java/com/mist/player/MainActivity.java
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
