name: Build Mist Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - run: npm install
      - run: npm run build:web
      - name: Fix Capacitor permissions (Windows push fix)
        run: |
          chmod +x node_modules/.bin/cap || true
          chmod +x node_modules/@capacitor/cli/bin/capacitor || true
      - run: |
          if [ ! -d "android" ]; then node ./node_modules/@capacitor/cli/bin/capacitor add android; fi
          cp -r android-plugin-src/* android/app/src/main/java/ 2>/dev/null || true
      - run: node ./node_modules/@capacitor/cli/bin/capacitor sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
